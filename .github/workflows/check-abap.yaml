name: check-abap

# The demo app (src/01) and the BSP sidecars (src/02) through abaplint -
# ABAP Standard (abaplint.jsonc), ABAP Cloud and the 7.02 downport - and the
# demo app through the abap2UI5 linter (abap2ui5lint.jsonc). Weekly too: the
# configs lint against abap2UI5 main and its 702 branch, which move.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-abap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abaplint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [standard, cloud, "702"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - if: matrix.target == 'standard'
        run: npm run abaplint
      - if: matrix.target == 'cloud'
        run: npm run abaplint:cloud
      # rewrites src/ in place - CI only, the downported source is never committed
      - if: matrix.target == '702'
        run: npm run downport && npm run abaplint:702

  abap2ui5-linter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:abap2ui5
