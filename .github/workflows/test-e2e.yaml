name: test-e2e

# The Playwright smoke test of the host page (test/e2e): the BSP of src/02
# as delivered, Office.js replaced by a stub, the demo app on abap2UI5 in
# Node (@abap2ui5/node-runtime), UI5 from npm - on UI5 1.136 and on the 1.71
# floor. It proves that the page boots, the embedded app renders and
# z2ui5.cc.ExcelBridge calls the (stubbed) Excel API; not that a real Excel
# takes the add-in (README, "What is tested").

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "57 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:build
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
