<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>abap2UI5 for Excel</title>
    <link rel="stylesheet" href="host.css">
    <!-- Office.js first, in the head, from Microsoft's CDN - the add-in
         platform requires both. It nulls history.pushState / replaceState,
         which history_cache.js keeps and office_init.js puts back (the
         workaround Microsoft documents). No inline script anywhere: a
         Content-Security-Policy without 'unsafe-inline' needs nothing extra.
         The CDN host is the one to allow in script-src (README, "CSP"). -->
    <script src="history_cache.js"></script>
    <script src="https://officeapis.public.onecdn.static.microsoft/1/office.js"></script>
    <script src="office_init.js"></script>
    <!-- UI5 of this system (resources/ of a BSP under /sap/bc/ui5_ui5 is the
         system's UI5). frameOptions allow: Excel on the web shows the task
         pane in an iframe of an Office domain - what may frame this page is
         the server's frame-ancestors (README). The add-in's own module and
         the embed control are found through the resource roots; host.js
         starts the abap2UI5 app. -->
    <script
        id="sap-ui-bootstrap"
        src="resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-frameOptions="allow"
        data-sap-ui-resourceroots='{
            "z2ui5xl": "./",
            "z2ui5.embed": "./thirdparty/z2ui5/embed/"
        }'
        data-sap-ui-oninit="module:z2ui5xl/host"
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact">
    <div id="z2ui5xl-root" class="z2ui5xlRoot">
        <div id="z2ui5xl-message" class="z2ui5xlMessage" role="status" hidden>
            <span id="z2ui5xl-message-text" class="z2ui5xlMessageText"></span>
            <button id="z2ui5xl-message-close" class="z2ui5xlMessageClose" type="button" title="Close" aria-label="Close">&#x2715;</button>
        </div>
        <div id="z2ui5xl-app" class="z2ui5xlApp"></div>
    </div>
</body>
</html>
